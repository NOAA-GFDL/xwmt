# Publish the package to PyPI on a GitHub release, using PyPI Trusted
# Publishing (OIDC) instead of a long-lived API token.
#
# One-time setup on PyPI: add a Trusted Publisher for this repo/workflow under
# the project's "Publishing" settings (https://docs.pypi.org/trusted-publishers/).

name: Upload Python Package

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pypi  # protect releases behind a GitHub Environment
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distribution metadata
        run: twine check dist/*
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
