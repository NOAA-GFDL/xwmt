name: test_env_xwmt
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Leave python unpinned so the CI matrix (setup-miniconda) owns the version;
  # pinning it here (e.g. >=3.12) silently upgrades the 3.11 matrix cell.
  - python
  - black>=26
  - pylint
  - pytest
  - pytest-cov
  - netcdf4
  - gsw
  - pip
