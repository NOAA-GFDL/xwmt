[project]
name = "xwmt"
dynamic = ["version"]
authors = [
    {name="Henri F. Drake", email="hfdrake@uci.edu"},
    {name="Jan-Erik Tesdal", email="jt7058@princeton.edu"}
]
description = "Water Mass Transformation Routines for xarray"
keywords = [
    "oceanography",
    "ocean modeling",
    "water mass transformation",
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    # Equations of state are delegated to `xeos`, which vendors the JMD95/Wright/
    # UNESCO/MDJWF/Roquet/MPAS kernels as pure-numpy and pulls in `gsw` for TEOS-10.
    #
    # >= 0.2.1 for metadata, not behaviour: xwmt defers to xeos for the attributes
    # on `alpha`/`beta`/`rho` (see `xwmt.attrs.set_default_attrs`), and 0.2.1 is
    # where those became UDUNITS-2 parseable -- before it, `beta` carried the
    # placeholder "(salinity unit)-1", which no CF checker can read. xwmt runs fine
    # against older xeos; it just cannot honestly promise CF-conformant metadata
    # there. See hdrake/xeos#8.
    "xeos[teos10] >= 0.2.1",
    # Used directly by xwmt for pressure (`gsw.p_from_z`) and temperature/salinity
    # kind conversions (e.g. `gsw.CT_from_pt`, `gsw.SA_from_SP`).
    "gsw >= 3.4.0",
    "numpy >= 1.23",
    # Required by xgcm's `transform` (conservative remapping), which xwmt uses for
    # the "xgcm"/"default" methods. Not imported directly by xwmt.
    "numba",
    "xarray >= 2022.3.0",
    "xhistogram >= 0.3.0",
    "xgcm >= 0.10.0",
    # 0.7.0 removed the old top-level `aggregate()`/`flatten_lol`; xwmt's
    # test/example flow uses `collect_budgets` + `BudgetQuery(...).aggregate()`
    # instead. See the xbudget 0.7 CHANGELOG.
    "xbudget >= 0.7.0",
]

[project.optional-dependencies]
# Optional accelerator for xarray reductions (bottleneck). Not imported directly.
accel = ["bottleneck"]
test = ["pytest", "netcdf4"]
dev = ["black", "pylint", "pytest", "netcdf4"]

[project.urls]
"Homepage" = "https://github.com/NOAA-GFDL/xwmt"
"Bugs/Issues/Features" = "https://github.com/NOAA-GFDL/xwmt/issues"
"Related package" = "https://github.com/hdrake/xwmb"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.black]
# Pin the formatting target so `black` output is deterministic across versions
# and the CI format gate is reproducible (the lint job installs a matching black).
target-version = ["py311"]
# `xwmt/_version.py` is written by hatch-vcs at build time and is not black-formatted.
# CI never sees it (the lint job does not install the package), but a local
# `black --check xwmt/` after an editable install would fail on a generated file.
extend-exclude = "xwmt/_version\\.py"

# The version comes from the git tag, not from a file in the tree. Releasing is
# then a single act -- tag `vX.Y.Z` and publish the GitHub Release -- with no
# second commit to remember, and no way for the tag and the built artifact to
# disagree about which version they are.
[tool.hatch.version]
source = "vcs"

# Drop the `+g<sha>` local segment. On a clean tag the version is exactly X.Y.Z
# either way, but an untagged build would otherwise carry a PEP 440 *local*
# version, which package indexes refuse outright. Untagged builds are
# `X.Y.Z.devN` instead, which an index will accept.
[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

# Building writes the resolved version to `xwmt/_version.py`, which is gitignored
# but *is* included in the sdist -- so `pip install` from the sdist, and
# conda-forge's build from the PyPI sdist, both work without git present.
[tool.hatch.build.hooks.vcs]
version-file = "xwmt/_version.py"

[tool.hatch.build]
exclude = ["examples/**", "data/**", "docs/**"]
