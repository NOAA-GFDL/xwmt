[project]
name = "xwmt"
dynamic = ["version"]
authors = [
    {name="Henri F. Drake", email="hfdrake@uci.edu"},
    {name="Jan-Erik Tesdal", email="jt7058@princeton.edu"}
]
description = "Water Mass Transformation Routines for xarray"
keywords = [
    "oceanography",
    "ocean modeling",
    "water mass transformation",
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    # Equations of state are delegated to `xeos`, which vendors the JMD95/Wright/
    # UNESCO/MDJWF/Roquet/MPAS kernels as pure-numpy and pulls in `gsw` for TEOS-10.
    "xeos[teos10] >= 0.1.0",
    # Used directly by xwmt for pressure (`gsw.p_from_z`) and temperature/salinity
    # kind conversions (e.g. `gsw.CT_from_pt`, `gsw.SA_from_SP`).
    "gsw >= 3.4.0",
    "numpy >= 1.23",
    # Required by xgcm's `transform` (conservative remapping), which xwmt uses for
    # the "xgcm"/"default" methods. Not imported directly by xwmt.
    "numba",
    "xarray >= 2022.3.0",
    "xhistogram >= 0.3.0",
    "xgcm >= 0.10.0",
    "xbudget >= 0.6.0",
]

[project.optional-dependencies]
# Optional accelerator for xarray reductions (bottleneck). Not imported directly.
accel = ["bottleneck"]
test = ["pytest", "netcdf4"]
dev = ["black", "pylint", "pytest", "netcdf4"]

[project.urls]
"Homepage" = "https://github.com/NOAA-GFDL/xwmt"
"Bugs/Issues/Features" = "https://github.com/NOAA-GFDL/xwmt/issues"
"Related package" = "https://github.com/hdrake/xwmb"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
# Pin the formatting target so `black` output is deterministic across versions
# and the CI format gate is reproducible (the lint job installs a matching black).
target-version = ["py311"]

[tool.hatch.version]
path = "xwmt/version.py"

[tool.hatch.build]
exclude = ["examples/**", "data/**", "docs/**"]
